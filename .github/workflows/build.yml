name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: ./gradlew build

      - uses: actions/upload-artifact@v5
        with:
          name: StackedArmadillos
          path: build/libs/*.jar
